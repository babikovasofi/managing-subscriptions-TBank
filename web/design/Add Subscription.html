<!doctype html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Добавить подписку</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="app.css" />
<link rel="stylesheet" href="add.css" />

<script src="theme.js"></script>
</head>
<body class="is-sheet-screen">

<!-- Dim teaser of subscriptions list visible behind the sheet -->
<div class="screen" data-screen-label="05 Add Subscription">

  <header class="top-bar">
    <span class="client-switcher">
      <span class="client-switcher__avatar">АП</span>
      <span class="client-switcher__name">Анна Петрова</span>
    </span>
  </header>

  <section class="add-bg-hero" aria-hidden="true">
    <div class="add-bg-hero__label">Подписки и сервисы</div>
    <div class="add-bg-hero__sum">2 847&nbsp;₽</div>
    <div class="add-bg-hero__meta">6 активных</div>
  </section>

</div>

<!-- Dimming overlay -->
<div class="sheet-backdrop" aria-hidden="true"></div>

<!-- Bottom-sheet -->
<div class="sheet" role="dialog" aria-label="Добавить подписку">

  <div class="sheet__grabber" aria-hidden="true"></div>

  <div class="sheet__header">
    <h1 class="sheet__title">Добавить подписку</h1>
    <a href="Subscriptions.html" class="sheet__close" aria-label="Закрыть" data-action="close-sheet">
      <svg viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </a>
  </div>

  <div class="sheet__body">

    <!-- Form: name -->
    <div class="field">
      <input
        id="f-name"
        class="field__input"
        type="text"
        placeholder=" "
        autocomplete="off"
      />
      <label class="field__label" for="f-name">Название подписки</label>
    </div>

    <!-- Form: amount -->
    <div class="field">
      <input
        id="f-amount"
        class="field__input"
        type="text"
        inputmode="numeric"
        placeholder=" "
        autocomplete="off"
      />
      <label class="field__label" for="f-amount">Сумма</label>
      <span class="field__suffix">₽</span>
    </div>

    <!-- Form: period (segmented) -->
    <div class="field--period">
      <span class="field__label-static">Период списания</span>
      <div class="segmented" role="radiogroup" aria-label="Период списания">
        <button type="button" class="segmented__item" data-action="set-period" data-period="week">Неделя</button>
        <button type="button" class="segmented__item segmented__item--active" aria-checked="true" role="radio" data-action="set-period" data-period="month">Месяц</button>
      </div>
    </div>

    <!-- Form: category (picker) -->
    <div class="field--picker" role="button" tabindex="0" data-action="pick-category">
      <div class="cat-icon cat-icon--sm cat-icon--cinema" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><rect x="3" y="6" width="18" height="12" rx="2" stroke="currentColor" stroke-width="2"/></svg>
      </div>
      <div class="field__col">
        <div class="field__hint">Категория</div>
        <div class="field__value">Видео</div>
      </div>
      <span class="field__chev" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M8 5l5 5-5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>

  </div>

  <!-- Sticky CTA -->
  <div class="sheet__footer">
    <button type="button" class="btn btn--lg btn--primary btn--block" data-action="submit-subscription">Добавить</button>
  </div>
</div>

<script>
  // Segmented control
  document.querySelectorAll('.segmented').forEach(function (group) {
    group.addEventListener('click', function (e) {
      var btn = e.target.closest('.segmented__item');
      if (!btn) return;
      group.querySelectorAll('.segmented__item').forEach(function (b) {
        b.classList.toggle('segmented__item--active', b === btn);
        b.setAttribute('aria-checked', b === btn ? 'true' : 'false');
      });
    });
  });
</script>
</body>
</html>
