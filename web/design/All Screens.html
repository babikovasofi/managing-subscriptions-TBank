<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>T-Bank Subscriptions — все экраны</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

<style>
  html, body { margin: 0; height: 100%; background: #0a0a0b; font-family: "Manrope", -apple-system, sans-serif; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
  function ScreenFrame({ src }) {
    return (
      <iframe
        src={src}
        title={src}
        style={{
          width: 430,
          height: 920,
          border: 0,
          display: 'block',
          background: '#000',
          borderRadius: 0,
        }}
      />
    );
  }

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="main" title="Управление подписками" subtitle="5 экранов · mobile-first 430px · fixed tabbar · единая тема (localStorage)">
          <DCArtboard id="subs"   label="01 · Подписки (главный)"       width={430} height={920}>
            <ScreenFrame src="Subscriptions.html" />
          </DCArtboard>
          <DCArtboard id="detail" label="02 · Детали подписки"          width={430} height={920}>
            <ScreenFrame src="Subscription Detail.html" />
          </DCArtboard>
          <DCArtboard id="analytics" label="03 · Аналитика"              width={430} height={920}>
            <ScreenFrame src="Analytics.html" />
          </DCArtboard>
          <DCArtboard id="notifs" label="04 · Уведомления"               width={430} height={920}>
            <ScreenFrame src="Notifications.html" />
          </DCArtboard>
          <DCArtboard id="add"    label="05 · Добавить (bottom-sheet)"   width={430} height={920}>
            <ScreenFrame src="Add Subscription.html" />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
